name: Mirror dev to school repo
on:
  push:
    branches: [dev]

concurrency:
  group: mirror-dev
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push dev to school repo
        env:
          SSH_KEY: ${{ secrets.SCHOOL_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git remote add school git@github.com:EpitechBachelorPromo2028/B-ING-300-MPL-3-1-codewash-1.git
          git push school HEAD:dev
